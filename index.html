<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Start a Business With $0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 1080x1920 stage. All sizes are rem, and 1rem = stage width / 108, so any render size looks the same. -->
  <div id="stage">
    <div id="bg" class="bg-dots"></div>
    <div id="scenes"></div>
    <div id="captions" class="caption-zone"></div>
    <div id="mascot-strip" class="mascot-strip"></div>
    <div id="wipe" class="wipe-layer"></div>
    <div id="draft" class="draft-mark" hidden>DRAFT · no voiceover</div>
    <div id="guides" class="guides" hidden><div class="g-top"></div><div class="g-bottom"></div></div>
  </div>

  <!-- GSAP from cdnjs, with a local copy of the same 3.12.5 file if the CDN is unreachable. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>window.gsap || document.write('<script src="vendor/gsap.min.js"><\/script>');</script>

  <script src="components/core.js"></script>
  <script src="components/stamp.js"></script>
  <script src="components/coins.js"></script>
  <script src="visuals.js"></script>
  <script src="timeline.js"></script>
</body>
</html>
