<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;src:url(Montserrat-VF.ttf);font-weight:100 900}
html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="960"></canvas>
<script>
const W=1920,H=960,c=document.getElementById('c'),x=c.getContext('2d');
const CORAL='#e8574e',NAVY='#232c4b',INK='#10131c',CARD='#1d2130',LINE='#2c3350',WHITE='#fff',DIM='#8b93ad';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),inv=(a,b,t)=>cl((t-a)/(b-a)),lerp=(a,b,t)=>a+(b-a)*t;
const oc=t=>1-Math.pow(1-t,3),ioc=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ob=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function rr(X,Y,w,h,r,fill,stroke,lw=2){x.beginPath();x.roundRect(X,Y,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function T(s,X,Y,sz,col=WHITE,wt=600,al='left',font='Mont'){x.font=`${wt} ${sz}px ${font}, Arial, sans-serif`;x.fillStyle=col;x.textAlign=al;x.textBaseline='alphabetic';x.fillText(s,X,Y)}
function wrap(s,maxW,sz,wt=500){x.font=`${wt} ${sz}px Mont, Arial, sans-serif`;const out=[];let line='';for(const w of s.split(' ')){const t=line?line+' '+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out}
function bg(top='#0e1220',bot='#171c30'){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);x.fillStyle=g;x.fillRect(0,0,W,H)}
function tag(txt,col=CORAL){x.font='800 22px Mont, Arial';const w=x.measureText(txt).width+36;rr(48,40,w,44,22,'rgba(0,0,0,.35)',col,2);T(txt,48+18,70,22,col,800)}
function win(X,Y,w,h,title=''){rr(X,Y,w,h,28,CARD,LINE,2);rr(X,Y,w,64,{upperLeft:28},'#171b29');['#e8574e','#f5c26b','#6bd68a'].forEach((c0,i)=>{x.beginPath();x.arc(X+38+i*30,Y+32,9,0,7);x.fillStyle=c0;x.fill()});if(title)T(title,X+w/2,Y+40,22,DIM,600,'center')}
function bubble(X,Y,w,h,fill){rr(X,Y,w,h,26,fill)}
function typed(s,t,t0,cps=22){return s.slice(0,Math.floor(cl((t-t0)*cps,0,s.length)))}
function cursor(X,Y,h,t,on=true){if(on&&Math.floor(t*2.2)%2==0){x.fillStyle=WHITE;x.fillRect(X,Y,4,h)}}
function pop(t,t0,d=.35){return ob(inv(t0,t0+d,t))}
const CLIPS={};
// 1 chat question
CLIPS.f01_chat_question={dur:2.6,draw(t){bg();tag('ILLUSTRATION');win(360,150,1200,660,'chat');
 const q=typed('What is the capital of France?',t,.3,20);const qw=rr&&0;
 const wq=Math.max(120,(x.font='600 42px Mont',x.measureText(q).width+70));bubble(1500-wq,260,wq,92,'#2f3d63');T(q,1500-wq+35,320,42,WHITE,500);
 if(t>1.6){bubble(420,400,150,92,'#262b3c');for(let i=0;i<3;i++){const a=.35+.65*Math.max(0,Math.sin((t*5)-i*.9));x.globalAlpha=a;x.beginPath();x.arc(466+i*40,446,9,0,7);x.fillStyle=DIM;x.fill()}x.globalAlpha=1}
 else cursor(1500-wq+35+ (x.font='500 42px Mont',x.measureText(q).width)+6,290,44,t)}};
// 2 next word
CLIPS.f02_nextword={dur:3.4,draw(t){bg();tag('ILLUSTRATION');
 const s='The capital of France is';x.font='700 84px Mont';const sw=x.measureText(s+' ').width;const slotW=300;const X0=(W-sw-slotW)/2;
 T(s,X0,330,84,WHITE,700);const sx=X0+sw;
 rr(sx,250,slotW,110,22,'rgba(255,255,255,.06)',inv(2.3,2.5,t)>0?CORAL:DIM,3);
 const cand=[['Paris',1],['Lyon',.34],['a',.2],['located',.13]];
 cand.forEach(([w,v],i)=>{const k=oc(inv(.5+i*.18,1.2+i*.18,t));const Y=470+i*92;T(w,sx-40,Y+40,40,i==0&&t>2.3?CORAL:WHITE,600,'right');rr(sx,Y,520,50,25,'rgba(255,255,255,.07)');rr(sx,Y,Math.max(0,520*v*k),50,25,i==0?CORAL:'#5b6a98')});
 if(t>2.3){const k=ob(inv(2.3,2.7,t));x.save();x.translate(sx+slotW/2,305);x.scale(k,k);T('Paris',0,28,84,CORAL,800,'center');x.restore()}
 T('MOST LIKELY NEXT WORD',W/2,880,26,DIM,700,'center')}};
// 3 next word 2
CLIPS.f03_nextword2={dur:2.4,draw(t){bg();tag('ILLUSTRATION');x.font='700 120px Mont';const sw=x.measureText('Once upon a ').width,cw=400,X0=(W-sw-cw)/2;T('Once upon a',X0,500,120,WHITE,700);
 rr(X0+sw,370,cw,170,28,'rgba(255,255,255,.06)',DIM,3);const k=ob(inv(.9,1.3,t));x.save();x.translate(X0+sw+cw/2,500);x.scale(k,k);T('time',0,0,120,CORAL,800,'center');x.restore()}};
// 4 text wall
CLIPS.f04_textwall={dur:3.4,draw(t){bg('#0b0e1a','#141a2e');const words='the of and to in a is that it was for on are as with they be at one have this from or had by hot but some what there we can out other were all your when up use word how said an each she which do their time if will way about many then them write would like so these her long make thing see him two has look more day could go come did number sound no most people my over know water than call first who may down side been now find'.split(' ');
 for(let col=0;col<6;col++){const sp=40+col*14;const off=(t*sp)%90;x.globalAlpha=.55;for(let r=-1;r<14;r++){const Y=r*90+off+60;let s='';for(let k=0;k<3;k++)s+=words[(col*31+r*7+k*3+ (r<0?0:0)+1000)%words.length]+' ';T(s,60+col*310,Y,28,col%2?'#6e7ba6':'#8b93ad',500)}x.globalAlpha=1}
 const g=x.createRadialGradient(W/2,H/2,200,W/2,H/2,1000);g.addColorStop(0,'rgba(11,14,26,0)');g.addColorStop(1,'rgba(11,14,26,.92)');x.fillStyle=g;x.fillRect(0,0,W,H);
 tag('ILLUSTRATION')}};
// 5 predict loop
CLIPS.f05_predict={dur:3.4,draw(t){bg();tag('ILLUSTRATION');const ws='The sun rises in the east and sets'.split(' ');let line='';const n=Math.min(ws.length,Math.floor(t/.38)+1);
 x.font='700 76px Mont';let X=160;const Y=430;for(let i=0;i<n;i++){const k=i==n-1?pop(t,i*.38,.25):1;const w=x.measureText(ws[i]+' ').width;x.save();x.translate(X+w/2,Y);x.scale(k,k);T(ws[i],-w/2,0,76,i==n-1?CORAL:WHITE,700);x.restore();X+=w}
 const nx=X;rr(nx,Y-80,220,110,22,'rgba(255,255,255,.06)',DIM,3);if(Math.floor(t*4)%2==0)T('?',nx+110,Y,76,DIM,800,'center');
 T('ONE WORD AT A TIME',W/2,820,26,DIM,700,'center')}};
// 6 stream answer
CLIPS.f06_stream={dur:4.2,draw(t){bg();tag('ILLUSTRATION');win(300,130,1320,700,'chat');
 bubble(980,230,560,86,'#2f3d63');T('Tell me about bakeries',1010,288,38,WHITE,500);
 const ans='A neighbourhood bakery usually opens early in the morning, long before most other shops, so the bread is fresh for breakfast.'.split(' ');const n=Math.min(ans.length,Math.floor((t-.5)/.22)+1);
 bubble(340,360,1240,360,'#262b3c');let X=380,Y=430;x.font='500 40px Mont';for(let i=0;i<Math.max(0,n);i++){const w=x.measureText(ans[i]+' ').width;if(X+w>1540){X=380;Y+=64}
 if(i==n-1){x.fillStyle='rgba(232,87,78,.25)';x.fillRect(X-6,Y-40,w+6,56);x.fillStyle=CORAL;x.fillRect(X-6,Y+16,w+6,4)}T(ans[i],X,Y,40,WHITE,500);X+=w}}};
// 7 real docs page
let DOC=null,DB=null;
CLIPS.f07_docs={dur:4.4,draw(t){bg('#fff','#fff');if(!DOC)return;const k=ioc(inv(.2,2.2,t));const s=lerp(1,2.0,k);
 const cx=DB.x+DB.w/2,cy=DB.y+DB.h/2;const tx=lerp(W/2,W/2,0),ty=lerp(H/2,H/2,0);
 x.save();x.translate(W/2,H/2);x.scale(s,s);x.translate(-lerp(W/2,cx,k),-lerp(H/2,cy,k));x.drawImage(DOC,0,0,W,H);
 const hk=inv(1.8,2.6,t);if(hk>0){x.strokeStyle=CORAL;x.lineWidth=5/s*1.1;x.beginPath();x.roundRect(DB.x-14,DB.y-10,DB.w+28,DB.h+14,10);x.stroke();x.fillStyle=`rgba(232,87,78,${.1*hk})`;x.fill()}x.restore();
 x.fillStyle='rgba(0,0,0,.72)';rr(48,40,560,44,22,'rgba(0,0,0,.72)');T('REAL PAGE · platform.claude.com docs',66,70,22,WHITE,700)}};
// 8 quote card openai
CLIPS.f08_quote_openai={dur:3.4,draw(t){bg(NAVY,'#2e3c61');tag('QUOTE · OpenAI',DIM);T('“',230,360,260,CORAL,800);
 const q=['Hallucinations are plausible but','false statements generated by','language models.'];q.forEach((l,i)=>{const a=oc(inv(.2+i*.25,.8+i*.25,t));x.globalAlpha=a;T(l,300,430+i*110-(1-a)*20,92,WHITE,700);x.globalAlpha=1});
 const h=inv(1.3,1.9,t);if(h>0){x.font='700 92px Mont';const pre=x.measureText('Hallucinations are ').width;const pw=x.measureText('plausible but').width;x.fillStyle=`rgba(232,87,78,${.35*h})`;x.fillRect(300+pre,430-82,pw*h,108)}
 T('OpenAI · “Why language models hallucinate”',300,790,32,DIM,600)}};
// 9 confident but wrong
CLIPS.f09_confident={dur:3.6,draw(t){bg();tag('ILLUSTRATION · made-up example');win(300,130,1320,700,'chat');
 bubble(1010,230,530,86,'#2f3d63');T('Who wrote the study?',1040,288,38,WHITE,500);
 bubble(340,360,1240,300,'#262b3c');T('The study was written by',390,450,46,WHITE,500);T('Dr. Jane Placeholder (2019).',390,520,46,WHITE,700);T('I am certain of this.',390,600,40,DIM,500);
 const k=inv(1.7,2.0,t);if(k>0){const s=ob(inv(1.7,2.15,t));x.save();x.translate(1330,610);x.rotate(-.12);x.scale(s,s);rr(-190,-48,380,96,16,'rgba(232,87,78,.12)',CORAL,7);T('NOT TRUE',0,24,56,CORAL,800,'center');x.restore();
 x.strokeStyle=CORAL;x.lineWidth=7;x.beginPath();x.moveTo(390,505);x.lineTo(390+Math.min(1,k*1.4)*700,505);x.stroke()}}};
// 10 checklist
CLIPS.f10_checklist={dur:3.4,draw(t){bg(NAVY,'#2e3c61');const rows=[['NAME','Dr. J. Smith'],['NUMBER','42%'],['LINK','example.com/page']];
 rows.forEach(([a,b],i)=>{const k=oc(inv(.2+i*.5,.7+i*.5,t));const Y=230+i*190;x.globalAlpha=k;rr(400,Y,1120,140,28,'rgba(255,255,255,.07)','rgba(255,255,255,.25)',2);T(a,460,Y+88,56,WHITE,800);T(b,820,Y+88,44,DIM,500);
 const ck=ob(inv(.9+i*.5,1.2+i*.5,t));if(ck>0){x.save();x.translate(1420,Y+70);x.scale(ck,ck);x.beginPath();x.arc(0,0,40,0,7);x.fillStyle=CORAL;x.fill();x.strokeStyle=WHITE;x.lineWidth=9;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(-17,2);x.lineTo(-4,16);x.lineTo(20,-14);x.stroke();x.restore()}x.globalAlpha=1});
 tag('ILLUSTRATION')}};
// 11 draft then check
CLIPS.f11_draft_check={dur:3.4,draw(t){bg();tag('ILLUSTRATION');rr(560,110,800,780,24,'#f4f1e8','#d9d5c8',2);T('DRAFT',640,200,34,'#b9b4a2',800);
 const n=Math.floor(cl(t/1.4,0,1)*9);for(let i=0;i<9;i++){const w=i==8?380:(560+((i*97)%140)-60);const k=i<n?1:(i==n?(cl(t/1.4*9-n)):0);rr(640,260+i*64,w*k,22,11,'#c9c4b2')}
 const s=inv(1.6,2.8,t);if(s>0){const Y=260+oc(s)*3*64;x.fillStyle='rgba(232,87,78,.32)';x.fillRect(630,Y-6,700,56)}
 const m=inv(1.8,3.0,t);if(m>0){const mx=lerp(1220,900,ioc(m)),my=lerp(780,520,ioc(m));x.strokeStyle=CORAL;x.lineWidth=14;x.beginPath();x.arc(mx,my,90,0,7);x.stroke();x.beginPath();x.moveTo(mx+64,my+64);x.lineTo(mx+140,my+140);x.stroke()}}};
// 12 end card
CLIPS.f12_endcard={dur:2.4,draw(t){bg(NAVY,'#2e3c61');const k=ob(inv(0,.5,t));x.save();x.translate(W/2,350);x.scale(k,k);x.beginPath();x.arc(0,0,95,0,7);x.fillStyle=CORAL;x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(14,-52);x.lineTo(-30,10);x.lineTo(-2,10);x.lineTo(-10,52);x.lineTo(34,-12);x.lineTo(6,-12);x.closePath();x.fill();x.restore();
 const a=oc(inv(.3,.8,t));x.globalAlpha=a;T('@axiomallai',W/2,590,120,WHITE,800,'center');T('AI WORKFLOWS',W/2,670,38,'#bfc7e6',700,'center');x.globalAlpha=1;
 const f=inv(1.0,1.4,t);if(f>0){const s=1+.04*Math.sin(t*8);x.save();x.translate(W/2,790);x.scale(s,s);rr(-170,-42,340,84,42,CORAL);T('FOLLOW',0,14,40,WHITE,800,'center');x.restore()}}};
window.names=Object.keys(CLIPS);window.dur=n=>CLIPS[n].dur;
window.setDoc=async(src,box)=>{DB=box;DOC=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src})};
window.ready=document.fonts.load('800 40px Mont').then(()=>document.fonts.load('700 40px Mont')).then(()=>document.fonts.load('500 40px Mont')).then(()=>document.fonts.load('600 40px Mont'));
window.frame=(n,t)=>{x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;CLIPS[n].draw(t);return c.toDataURL('image/png')};
</script></body></html>
